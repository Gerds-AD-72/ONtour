<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wohnmobil Tracker</title>
<style>
  body { font-family: Arial; background: #f0f0f0; }
  #map { height: 80vh; width: 100%; }
  #info { padding: 10px; font-size: 18px; }
</style>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

</head>
<body>

<div id="info">Lade Daten...</div>
<button onclick="forceUpdate()">Force-Update</button>
<div id="map"></div>

<script>
let map = L.map('map').setView([53.0, 9.0], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let marker = L.marker([53.0, 9.0]).addTo(map);

let lastUpdateTime = Date.now();

async function updatePosition() {
  let url = "https://io.adafruit.com/api/v2/Gerd_K/feeds/gps-data/data/last";
  let res = await fetch(url);
  let data = await res.json();

  let raw = data.value.split(";");
  let obj = {};
  raw.forEach(p => {
    let [k, v] = p.split("=");
    obj[k] = parseFloat(v);
  });

  let lat = obj.lat;
  let lng = obj.lng;
  let speed = obj.speed;
  let sat = obj.sat;
  let alt_baro = obj.alt_baro;
  let temp = obj.temp;
  let hum = obj.hum;
  let press = obj.press;

  lastUpdateTime = Date.now();

  // ---------- Status-Logik ----------
  let gpsValid = (lat !== 0 && lng !== 0);
  let diffSec = Math.round((Date.now() - lastUpdateTime) / 1000);

  let statusColor = "🔴";

  if (gpsValid && diffSec < 10) statusColor = "🟢";
  else if (gpsValid && diffSec < 30) statusColor = "🟡";
  else statusColor = "🔴";

  // ---------- Info-Anzeige ----------
  document.getElementById("info").innerHTML =
    `GPS: ${lat.toFixed(6)}, ${lng.toFixed(6)} ${statusColor} | `
    + `Speed: ${speed.toFixed(1)} km/h | `
    + `Satelliten: ${sat} | `
    + `Höhe: ${alt_baro.toFixed(1)} m<br>`
    + `Temperatur: ${temp.toFixed(1)} °C | `
    + `Luftfeuchtigkeit: ${hum.toFixed(1)} % | `
    + `Luftdruck: ${press.toFixed(1)} hPa`;

  marker.setLatLng([lat, lng]);
  map.setView([lat, lng]);
}

async function forceUpdate() {
  await fetch("https://io.adafruit.com/api/v2/Gerd_K/feeds/force-update/data", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ value: 1 })
  });
}

setInterval(updatePosition, 5000);
updatePosition();
</script>

</body>
</html>
