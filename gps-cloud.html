<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>GPS-Cloud-Karte</title>
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { margin:0; padding:0; height:100%; }
    #map { width:100%; height:90%; }
    #info {
      height:10%;
      padding:8px;
      font-family:Arial;
      background:#f0f0f0;
      border-top:1px solid #ccc;
    }
  </style>
</head>
<body>

<div id="map"></div>
<div id="info">Warte auf Daten...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const FEED_URL =
  "https://io.adafruit.com/api/v2/Gerd_K/feeds/gps-data";

let map = L.map('map').setView([53.0, 9.0], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let marker = null;
let polyline = L.polyline([], {color: 'red'}).addTo(map);

function parseValueString(v) {
  const parts = v.split(';');
  const obj = {};
  parts.forEach(p => {
    const [k, val] = p.split('=');
    if (!k) return;
    obj[k.trim()] = parseFloat(val);
  });
  return obj;
}

async function updatePosition() {
  try {
    const r = await fetch(FEED_URL);
    const j = await r.json();
    const data = parseValueString(j.last_value);

    const lat  = data.lat;
    const lng  = data.lng;
    const speed = data.speed;
    const volt = data.volt;
    const amp  = data.amp;
    const soc  = data.soc;
    const temp = data.temp;

    if (!lat || !lng) return;

    const pos = [lat, lng];

    if (!marker) {
      marker = L.marker(pos).addTo(map);
      map.setView(pos, 14);
    } else {
      marker.setLatLng(pos);
    }

    polyline.addLatLng(pos);

    document.getElementById("info").innerHTML =
      `GPS: ${lat.toFixed(6)}, ${lng.toFixed(6)} | `
      + `Speed: ${speed.toFixed(1)} km/h | `
      + `Volt: ${volt.toFixed(2)} V | `
      + `Amp: ${amp.toFixed(2)} A | `
      + `SOC: ${soc}% | `
      + `Temp: ${temp.toFixed(1)} °C`;

  } catch (e) {
    console.log("Fehler beim Laden:", e);
  }
}

updatePosition();
setInterval(updatePosition, 5000);
</script>
</body>
</html>
