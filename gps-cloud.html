<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>GPS-Cloud-Karte</title>
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { margin:0; padding:0; height:100%; }
    #map { width:100%; height:80%; }

    #info {
      height:10%;
      padding:8px;
      font-family:Arial;
      background:#f0f0f0;
      border-top:1px solid #ccc;
    }

    #layers {
      width:100%;
      text-align:center;
      padding:8px;
      background:#ffffff;
      border-top:1px solid #ccc;
      font-family:Arial;
    }
    #layers button {
      margin:4px;
      padding:6px 12px;
      cursor:pointer;
    }

    #follow {
      width:100%;
      text-align:center;
      padding:6px;
      background:#e8e8e8;
      border-top:1px solid #ccc;
      font-family:Arial;
    }
    #follow button {
      margin:4px;
      padding:6px 12px;
      cursor:pointer;
    }

    /* Force-Update Button oben rechts */
    #forceBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #007bff;   /* blau */
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      font-family: Arial;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
      z-index: 9999;
      transition: background 0.3s;
    }
    #forceBtn.active {
      background: #00c851;   /* grün */
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Force-Update Button -->
<div id="forceBtn" onclick="sendForceUpdate()">Force-Update</div>

<!-- GPS-Anzeige -->
<div id="info">Warte auf Daten...</div>

<!-- Auto-Follow -->
<div id="follow">
  <button onclick="autoFollow=true">Auto-Follow EIN</button>
  <button onclick="autoFollow=false">Auto-Follow AUS</button>
</div>

<!-- Karten-Umschaltung -->
<div id="layers">
  <button onclick="setLayer('standard')">Standard</button>
  <button onclick="setLayer('sat')">Satellit</button>
  <button onclick="setLayer('hybrid')">Hybrid</button>
  <button onclick="setLayer('dark')">Dark Mode</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const FEED_URL =
  "https://io.adafruit.com/api/v2/Gerd_K/feeds/gps-data";

const FORCE_URL =
  "https://io.adafruit.com/api/v2/Gerd_K/feeds/force-update";

let autoFollow = true;

// ---------- Karte ----------
let map = L.map('map').setView([53.0, 9.0], 17);   // ZOOM 17

// ---------- Karten-Layer ----------
const layerStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
const layerSat      = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
  subdomains:['mt0','mt1','mt2','mt3']
});
const layerHybrid   = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
  subdomains:['mt0','mt1','mt2','mt3']
});
const layerDark     = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png');

// Standard aktivieren
let activeLayer = layerStandard;
activeLayer.addTo(map);

// ---------- Layer-Umschaltung ----------
function setLayer(type) {
  map.removeLayer(activeLayer);

  if (type === "standard") activeLayer = layerStandard;
  if (type === "sat")      activeLayer = layerSat;
  if (type === "hybrid")   activeLayer = layerHybrid;
  if (type === "dark")     activeLayer = layerDark;

  activeLayer.addTo(map);
}

// ---------- Farbspur ----------
function getColor(speed) {
  if (speed < 33) return "yellow";
  if (speed < 54) return "green";
  if (speed < 105) return "blue";
  return "red";
}

let marker = null;

function parseValueString(v) {
  const parts = v.split(';');
  const obj = {};
  parts.forEach(p => {
    const [k, val] = p.split('=');
    if (!k) return;
    obj[k.trim()] = parseFloat(val);
  });
  return obj;
}

// ---------- Force-Update senden ----------
async function sendForceUpdate() {
  const btn = document.getElementById("forceBtn");
  btn.classList.add("active");   // Button grün

  try {
    await fetch(FORCE_URL + "/data", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value: 1 })
    });
  } catch (e) {
    console.log("Force-Update Fehler:", e);
  }
}

// ---------- Force-Update Status prüfen ----------
async function checkForceStatus() {
  try {
    const r = await fetch(FORCE_URL + "/data/last");
    const j = await r.json();
    const val = parseFloat(j.value);

    const btn = document.getElementById("forceBtn");

    if (val === 1) {
      btn.classList.add("active");   // grün
    } else {
      btn.classList.remove("active"); // blau
    }
  } catch (e) {
    console.log("Force-Status Fehler:", e);
  }
}

// ---------- GPS aktualisieren ----------
async function updatePosition() {
  try {
    const r = await fetch(FEED_URL);
    const j = await r.json();
    const data = parseValueString(j.last_value);

    const lat  = data.lat;
    const lng  = data.lng;
    const speed = data.speed;
    const sat   = data.sat;

    if (!lat || !lng) return;

    const pos = [lat, lng];

    if (!marker) {
      marker = L.marker(pos).addTo(map);
      map.setView(pos, 17);   // ZOOM 17
    } else {
      marker.setLatLng(pos);
    }
// automatischer Zoom nach Geschwindigkeit
let zoomLevel = 17;   // Standard bei schneller Fahrt

if (speed < 5) zoomLevel = 20;     // sehr langsam / stehen
else if (speed < 20) zoomLevel = 19;  // Stadtverkehr
else if (speed < 40) zoomLevel = 18;  // Landstraße
else zoomLevel = 17;                 // schnell / Autobahn

if (autoFollow) {
    map.setView(pos, zoomLevel);
}
    

    if (speed >= 1) {
      L.polyline([pos], {color: getColor(speed), weight: 5}).addTo(map);
    }

    document.getElementById("info").innerHTML =
      `GPS: ${lat.toFixed(6)}, ${lng.toFixed(6)} | `
      + `Speed: ${speed.toFixed(1)} km/h | `
      + `Satelliten: ${sat}`;

  } catch (e) {
    console.log("Fehler beim Laden:", e);
  }
}

// ---------- Intervalle ----------
updatePosition();
setInterval(updatePosition, 5000);
setInterval(checkForceStatus, 2000);
</script>
</body>
</html>
