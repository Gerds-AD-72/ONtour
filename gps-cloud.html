<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>GPS-Cloud-Karte</title>
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { margin:0; padding:0; height:100%; }
    #map { width:100%; height:70%; }
    #info {
      height:10%;
      padding:8px;
      font-family:Arial;
      background:#f0f0f0;
      border-top:1px solid #ccc;
    }
    #follow {
      width:100%;
      text-align:center;
      padding:6px;
      background:#e8e8e8;
      border-top:1px solid #ccc;
      font-family:Arial;
    }
    #follow button {
      margin:4px;
      padding:6px 12px;
      cursor:pointer;
    }
    #zoomslider {
      width:100%;
      text-align:center;
      padding:6px;
      background:#ffffff;
      border-top:1px solid #ccc;
      font-family:Arial;
    }
    #zoomslider input {
      width:60%;
    }
    #layers {
      width:100%;
      text-align:center;
      padding:8px;
      background:#ffffff;
      border-top:1px solid #ccc;
      font-family:Arial;
    }
    #layers button {
      margin:4px;
      padding:6px 12px;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div id="info">Warte auf Daten...</div>

<div id="follow">
  <button onclick="autoFollow=true">Auto-Follow EIN</button>
  <button onclick="autoFollow=false">Auto-Follow AUS</button>
  <button onclick="updatePosition()">Aktualisieren</button>
  <span id="status" style="font-weight:bold; margin-left:10px;">🟢</span>
</div>

<div id="zoomslider">
  Zoom: <input type="range" min="10" max="21" value="14" id="zoomRange" oninput="setZoom(this.value)">
</div>

<div id="layers">
  <button onclick="setLayer('standard')">Standard</button>
  <button onclick="setLayer('sat')">Satellit</button>
  <button onclick="setLayer('hybrid')">Hybrid</button>
  <button onclick="setLayer('dark')">Dark Mode</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const FEED_URL =
  "https://io.adafruit.com/api/v2/Gerd_K/feeds/gps-data";

let autoFollow = true;
let lastUpdateTime = 0;

let map = L.map('map').setView([53.0, 9.0], 14);

function setZoom(z) {
  map.setZoom(z);
}

const layerStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:21});
const layerSat      = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{subdomains:['mt0','mt1','mt2','mt3'],maxZoom:21});
const layerHybrid   = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{subdomains:['mt0','mt1','mt2','mt3'],maxZoom:21});
const layerDark     = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',{maxZoom:21});

let activeLayer = layerStandard;
activeLayer.addTo(map);

function setLayer(type) {
  map.removeLayer(activeLayer);
  if (type === "standard") activeLayer = layerStandard;
  if (type === "sat")      activeLayer = layerSat;
  if (type === "hybrid")   activeLayer = layerHybrid;
  if (type === "dark")     activeLayer = layerDark;
  activeLayer.addTo(map);
}

function getColor(speed) {
  if (speed < 33) return "yellow";
  if (speed < 54) return "green";
  if (speed < 105) return "blue";
  return "red";
}

let marker = null;

function parseValueString(v) {
  const parts = v.split(';');
  const obj = {};
  parts.forEach(p => {
    const [k, val] = p.split('=');
    if (!k) return;
    obj[k.trim()] = parseFloat(val);
  });
  return obj;
}

async function updatePosition() {
  try {
    const r = await fetch(FEED_URL);
    const j = await r.json();
    const data = parseValueString(j.last_value);

    const lat  = data.lat;
    const lng  = data.lng;
    const speed = data.speed;
    const sat   = data.sat;
    const alt   = data.alt;

    if (!lat || !lng) return;

    // Zeitstempel NUR setzen, wenn echte Daten da sind
    lastUpdateTime = Date.now();

    const pos = [lat, lng];

    if (!marker) {
      marker = L.marker(pos).addTo(map);
      map.setView(pos, map.getZoom());
    } else {
      marker.setLatLng(pos);
    }

    if (autoFollow) {
      map.setView(pos, map.getZoom());
    }

    if (speed >= 1) {
      L.polyline([pos], {color: getColor(speed), weight: 5}).addTo(map);
    }

    let now = Date.now();
    let diffSec = Math.round((now - lastUpdateTime) / 1000);

    let statusColor = "🟢";
    if (diffSec >= 10 && diffSec < 30) statusColor = "🟡";
    if (diffSec >= 30) statusColor = "🔴";

    document.getElementById("status").innerHTML = statusColor;

    document.getElementById("info").innerHTML =
      `GPS: ${lat.toFixed(6)}, ${lng.toFixed(6)} | `
      + `Speed: ${speed.toFixed(1)} km/h | `
      + `Satelliten: ${sat} | `
      + `Höhe: ${alt.toFixed(1)} m<br>`
      + `Aktualisiert vor ${diffSec} Sekunden`;

  } catch (e) {
    console.log("Fehler beim Laden:", e);
  }
}

updatePosition();
setInterval(updatePosition, 5000);
</script>
</body>
</html>
