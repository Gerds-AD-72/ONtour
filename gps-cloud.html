<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>GPS-Cloud-Karte</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body {
  margin:0;
  padding:0;
  height:100%;
}

#map {
  width:100%;
  height:80%;
}

.table4 {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-family:Arial;
  font-size:15px;
}

.table4 th {
  background:#333;
  color:white;
  padding:8px;
  text-align:center;
  cursor:pointer;
}

.table4 td {
  background:#f2f2f2;
  padding:8px;
  text-align:center;
  line-height:1.6;
}

.madeby {
  font-size:12px;
  color:#777;
}

.table4 button {
  margin:6px;
  padding:6px 12px;
  cursor:pointer;
}
</style>
</head>


<body>


<div id="map"></div>


<table class="table4">

<tr>
<th onclick="setLayer('standard')">Standard Karte</th>
<th onclick="setLayer('sat')">Satelliten Karte</th>
<th onclick="setLayer('hybrid')">Hybrid Karte</th>
<th onclick="setLayer('dark')">Nacht Karte</th>
</tr>


<tr>

<td>
Datum:
<span id="gpsDate">--</span><br>

Uhrzeit:
<span id="gpsTime">--</span><br>

km/h:
<span id="gpsSpeed">--</span>
</td>


<td>

Breitengrad:
<span id="gpsLat">--</span><br>

Längengrad:
<span id="gpsLng">--</span><br>

Höhe über NN:
<span id="bmpHeight">--</span>

</td>


<td>

Temperatur:
<span id="bmpTemp">--</span><br>

Luftdruck:
<span id="bmpPress">--</span><br>

<span class="madeby">
Made by G.K.
</span>

</td>


<td>

<button onclick="autoFollow=true">
Verfolgung Ein
</button>

<br>

<button onclick="autoFollow=false">
Verfolgung Aus
</button>

</td>


</tr>

</table>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script>


const FEED_URL =
"https://io.adafruit.com/api/v2/Gerd_K/feeds/gps-data";


const BMP_URL =
"https://io.adafruit.com/api/v2/Gerd_K/feeds/bmp-data";



let autoFollow=true;



// Karte

let map=L.map('map')
.setView([53.0,9.0],14);



// Karten

const layerStandard =
L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
);


const layerSat =
L.tileLayer(
'https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
{
subdomains:['mt0','mt1','mt2','mt3']
});


const layerHybrid =
L.tileLayer(
'https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',
{
subdomains:['mt0','mt1','mt2','mt3']
});


const layerDark =
L.tileLayer(
'https://{s}.basemaps.cartocdn.com/dark_all/{x}/{y}.png'
);


let activeLayer=layerStandard;
activeLayer.addTo(map);



function setLayer(type){

map.removeLayer(activeLayer);


if(type=="standard")
activeLayer=layerStandard;

if(type=="sat")
activeLayer=layerSat;

if(type=="hybrid")
activeLayer=layerHybrid;

if(type=="dark")
activeLayer=layerDark;


activeLayer.addTo(map);

}



// Marker

let marker=null;



// GPS

async function updatePosition(){

try{


const r=await fetch(FEED_URL);

const j=await r.json();


const parts=j.last_value.split(";");


let lat=0;
let lng=0;
let speed=0;


parts.forEach(p=>{

const [key,val]=p.split("=");

if(!key)return;


if(key=="lat")
lat=parseFloat(val);


if(key=="lng")
lng=parseFloat(val);


if(key=="speed")
speed=parseFloat(val);


});


if(!lat || !lng)
return;



const pos=[lat,lng];



if(!marker){

marker=L.marker(pos).addTo(map);

map.setView(pos,14);

}
else{

marker.setLatLng(pos);

}



if(autoFollow)
map.setView(pos,14);



let now=new Date();


gpsDate.innerText=
now.toLocaleDateString("de-DE");


gpsTime.innerText=
now.toLocaleTimeString("de-DE");


gpsLat.innerText=
lat.toFixed(6);


gpsLng.innerText=
lng.toFixed(6);


gpsSpeed.innerText=
speed.toFixed(2);



}

catch(e){

console.log("GPS Fehler",e);

}

}




// BMP

async function updateBMP(){

try{


const r=await fetch(BMP_URL);

const j=await r.json();


const parts=j.last_value.split(";");


let height=0;
let temp=0;
let press=0;



parts.forEach(p=>{


const [key,val]=p.split("=");


if(key=="height")
height=parseFloat(val);


if(key=="temp")
temp=parseFloat(val);


if(key=="press")
press=parseFloat(val);


});



bmpHeight.innerText=
height.toFixed(2)+" m";


bmpTemp.innerText=
temp.toFixed(1)+" °C";


bmpPress.innerText=
press.toFixed(2)+" hPa";



}

catch(e){

console.log("BMP Fehler",e);

}

}





// Start

updatePosition();
updateBMP();


setInterval(updatePosition,5000);

setInterval(updateBMP,5000);



</script>

</body>
</html>
